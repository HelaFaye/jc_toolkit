# Joy-Con Toolkit: tests, then builds for Linux, Windows, macOS, Android and the Switch (homebrew).
# The builds are attached to each run (Actions > run > Artifacts); a tag v* also publishes
# them as a GitHub release, as does a manual run (Actions > Build > Run workflow) given a tag.
name: Build

on:
  push:
    # Both: with tags alone, a branch push wouldn't run it
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Publish a release under this new tag (e.g. v5.2.0); empty only builds"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System packages (virtual display for the app's self-test)
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libmtdev1
      - name: Venv
        run: scripts/setup_venv.sh
      - name: Tests
        run: .venv/bin/python -m pytest -v --timeout=300

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04        # Oldest glibc: the build runs on newer distributions too
            name: linux
          - os: ubuntu-22.04-arm    # Raspberry Pi and other 64-bit ARM Linux
            name: linux-arm64
          - os: windows-latest
            name: windows
          - os: windows-latest      # 32-bit Python: a 32-bit build (setup_venv.bat picks its packages)
            name: windows-x86
            arch: x86
          - os: macos-latest        # Apple Silicon
            name: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.arch }}
      - name: Venv (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\setup_venv.bat
      - name: Venv
        if: runner.os != 'Windows'
        run: scripts/setup_venv.sh
      - name: Tests (protocol and features)
        if: runner.os != 'Linux'
        env:
          JCTOOL_SKIP_GUI_TEST: "1"
        run: ${{ runner.os == 'Windows' && '.venv\Scripts\python' || '.venv/bin/python' }} -m pytest -v --timeout=300
      - name: Build
        run: ${{ runner.os == 'Windows' && '.venv\Scripts\python' || '.venv/bin/python' }} scripts/build.py desktop
      - name: Self-test the build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb libgl1-mesa-dri libmtdev1
          xvfb-run -a -s "-screen 0 1100x800x24" dist/JoyConToolkit/JoyConToolkit --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: JoyConToolkit-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  android:
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: System packages (python-for-android)
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev \
            libncurses-dev cmake libffi-dev libssl-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
      - name: Venv
        run: python -m venv .venv
      - name: Build the APK
        run: .venv/bin/python scripts/build.py android
      - uses: actions/upload-artifact@v4
        with:
          name: JoyConToolkit-android
          path: bin/*.apk

  switch:
    needs: test
    runs-on: ubuntu-latest
    container: devkitpro/devkita64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the homebrew
        run: make -C switch -j4
      - name: Name it like the other downloads
        run: |
          ver=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' jctool/__init__.py)
          mkdir -p out && cp switch/jctool.nro "out/JoyConToolkit-$ver-switch.nro"
      - uses: actions/upload-artifact@v4
        with:
          name: JoyConToolkit-switch
          path: out/*.nro

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    needs: [desktop, android, switch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # On a tag push both are empty and the pushed tag is used
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ inputs.tag != '' && github.sha || '' }}
          files: out/*
